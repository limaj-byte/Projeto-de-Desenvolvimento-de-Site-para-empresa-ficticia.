<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho | TechNova Store</title>
  <link rel="stylesheet" href="Styles/header.css">
  <link rel="stylesheet" href="Styles/footer.css">
  <link rel="stylesheet" href="Styles/carrinho.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <h1>Carrinho de compras</h1>
    <p id="mensagem-carrinho" data-store-message aria-live="polite"></p>
    <table>
      <thead>
        <tr><th scope="col">Imagem</th><th scope="col">Produto</th><th scope="col">Preço unitário</th><th scope="col">Quantidade</th><th scope="col">Subtotal</th><th scope="col">Ação</th></tr>
      </thead>
      <tbody id="itens-carrinho"><tr><td colspan="6">Carregando carrinho…</td></tr></tbody>
    </table>
    <section aria-labelledby="resumo-titulo">
      <h2 id="resumo-titulo">Resumo da compra</h2>
      <p>Subtotal: <strong id="subtotal">R$ 0,00</strong></p>
      <p>Retirada no estabelecimento: sem custo</p>
      <h3>Total: <strong id="total">R$ 0,00</strong></h3>
    </section>
    <p><a href="checkoutpagamento.html" id="finalizar-compra" hidden>Continuar para finalização</a></p>
    <p><a href="catalogo.html">Continuar comprando</a></p>
  </main>
  <div id="footer"></div>
  <script src="Components/components.js"></script>
  <script src="Script/store.js" defer></script>
</body>
</html>
