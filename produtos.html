<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos | TechNova Store</title>
  <link rel="stylesheet" href="Styles/header.css">
  <link rel="stylesheet" href="Styles/footer.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <h1>Produtos</h1>
    <section aria-labelledby="filtros-produtos">
      <h2 id="filtros-produtos">Pesquisar e filtrar</h2>
      <label for="pesquisa">Nome do produto</label>
      <input type="search" id="pesquisa" placeholder="Digite o nome do produto...">
      <label for="filtro-categoria">Categoria</label>
      <select id="filtro-categoria">
        <option value="">Todas as categorias</option>
        <option value="Smartphones">Smartphones</option>
        <option value="Áudio">Áudio</option>
        <option value="Periféricos">Periféricos</option>
      </select>
      <label for="ordenacao">Ordenar por</label>
      <select id="ordenacao">
        <option value="">Relevância</option>
        <option value="menor">Menor preço</option>
        <option value="maior">Maior preço</option>
        <option value="nome">Nome</option>
      </select>
    </section>
    <p id="mensagem-produto" data-store-message aria-live="polite"></p>
    <section id="lista-produtos" aria-label="Produtos disponíveis">
      <p>Carregando produtos…</p>
    </section>
    <section id="detalhes-produto" hidden aria-live="polite">
      <h2 id="detalhe-nome"></h2>
      <p id="detalhe-descricao"></p>
      <p id="detalhe-preco"></p>
      <p>Garantia: 12 meses (90 dias legais + 9 meses do fabricante).</p>
      <button type="button" id="fechar-detalhes">Fechar detalhes</button>
    </section>
    <p><a href="carrinho.html">Ir para o carrinho</a></p>
  </main>
  <div id="footer"></div>
  <script src="Components/components.js"></script>
  <script src="Script/store.js" defer></script>
</body>
</html>
