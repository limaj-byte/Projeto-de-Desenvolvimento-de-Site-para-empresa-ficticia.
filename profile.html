<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha conta | TechNova Store</title>
  <link rel="stylesheet" href="Styles/header.css">
  <link rel="stylesheet" href="Styles/footer.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <h1>Minha conta</h1>
    <section aria-labelledby="dados-conta-titulo">
      <h2 id="dados-conta-titulo">Dados da conta</h2>
      <p>Nome: <strong id="cliente-nome">Carregando…</strong></p>
      <p>E-mail: <strong id="cliente-email"></strong></p>
      <button type="button" data-logout>Sair da conta</button>
      <a href="admin.html" id="admin-link" hidden>Gerenciar pedidos</a>
    </section>
    <section aria-labelledby="pedidos-titulo">
      <h2 id="pedidos-titulo">Meus pedidos</h2>
      <div id="lista-pedidos" aria-live="polite"><p>Carregando pedidos…</p></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="Components/components.js"></script>
  <script src="Script/store.js" defer></script>
</body>
</html>
